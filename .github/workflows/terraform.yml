name: terraform
# Manual-only: infra/ ships as cloud-agnostic contract stubs (see PRODUCTION-READINESS.md).
# Wire real modules into infra/envs/<cloud>/<env> before enabling validate/plan on push.
on:
  workflow_dispatch: {}
permissions: {id-token: write, contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy: {matrix: {cloud: [aws], env: [dev]}}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/envs/${{ matrix.cloud }}/${{ matrix.env }}
        run: terraform init -backend=false && terraform validate
