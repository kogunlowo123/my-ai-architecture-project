name: ci
on: {pull_request: {}, push: {branches: [main]}}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml pytest ruff
      - run: ruff check projects services || true
      - name: unit tests (cigna-ceretax reference project)
        working-directory: projects/cigna-ceretax-unified-platform
        run: pytest -q
